    body.page-wrapper {
      min-height: 100vh;
    }

    .article-shell {
      max-width: 1075px;
      margin: 36px auto;
      padding: 0 24px 56px;
    }

    .theme-icon-btn {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0.25rem 0.45rem;
      border-radius: 0.25rem;
      cursor: pointer;
      line-height: 1;
    }

    .theme-icon-btn i {
      font-size: 1.05rem;
    }

    .article-card {
      background: #f8f5ef;
      border: 1px solid rgba(45, 49, 56, 0.12);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(45, 49, 56, 0.12);
      color: #2f3440;
    }

    body.dark .article-card {
      background: #2d2d2d;
      border-color: rgba(236, 230, 219, 0.16);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      color: #ece6db;
    }

    #article-root h1 {
      font-family: "Merriweather", Georgia, serif;
      font-size: clamp(1.72rem, 2.25vw, 2.32rem);
      line-height: 1.18;
      letter-spacing: 0.01em;
      margin-bottom: 0.85rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(45, 49, 56, 0.18);
      color: #22252d;
    }

    .essay-meta {
      margin: 0 0 1.6rem;
      font-size: 0.97rem;
      letter-spacing: 0.01em;
      color: #5b6474;
    }

    .essay-meta strong {
      font-weight: 700;
      color: inherit;
    }

    .essay-meta a {
      color: var(--kk-accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .essay-meta a:hover,
    .essay-meta a:focus {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #article-root h2,
    #article-root h3,
    #article-root h4 {
      color: #252a34;
    }

    #article-root p,
    #article-root li {
      color: inherit;
      line-height: 1.82;
      font-size: 1.03rem;
    }

    #article-root img[src$="sign_light_nobg.png"],
    #article-root img[src$="sign_dark_nobg.png"] {
      display: block;
      width: 50%;
      max-width: 220px;
      height: auto;
      margin: 0.2rem 0 0;
    }

    body.dark #article-root h1 {
      color: #f4eee2;
      border-bottom-color: rgba(236, 230, 219, 0.24);
    }

    body.dark .essay-meta {
      color: #d8cfc2;
    }

    body.dark .essay-meta a {
      color: var(--kk-accent-dark);
    }

    body.dark #article-root h2,
    body.dark #article-root h3,
    body.dark #article-root h4 {
      color: #f0e8da;
    }

    .error {
      border-radius: 10px;
      padding: 14px;
    }

    body.light .error {
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #991b1b;
    }

    body.dark .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    pre {
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    body.light pre {
      background: #f1f5f9;
    }

    body.dark pre {
      background: rgba(15, 23, 42, 0.95);
      color: #e2e8f0;
    }

    @media (max-width: 767.98px) {
      .article-shell {
        margin: 20px auto;
        padding: 0 14px 36px;
      }

      .article-card {
        padding: 20px 16px;
        border-radius: 12px;
      }

      #article-root h1 {
        font-size: 1.68rem;
        line-height: 1.28;
      }

      #article-root h2 {
        font-size: 1.36rem;
      }

      #article-root h3 {
        font-size: 1.18rem;
      }

      #article-root p,
      #article-root li {
        font-size: 0.98rem;
        line-height: 1.72;
      }

      .essay-meta {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

  <script src="../../js/vendor-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      const storageKey = 'main-site-theme';
      const toggleButton = document.getElementById('main-theme-toggle');
      const icon = document.getElementById('main-theme-toggle-icon');
      if (!toggleButton || !icon) return;
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem(storageKey);
      const initialTheme = savedTheme || (document.body.classList.contains('dark') ? 'dark' : (prefersDark ? 'dark' : 'light'));

      function setTheme(theme) {
        document.body.classList.remove('dark', 'light');
        document.body.classList.add(theme);
        icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        toggleButton.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        localStorage.setItem(storageKey, theme);
        updateSignatureImage(theme);
      }

      setTheme(initialTheme);
      toggleButton.addEventListener('click', function () {
        const next = document.body.classList.contains('dark') ? 'light' : 'dark';
        setTheme(next);
      });
    })();
  </script>

  <script>
    function updateSignatureImage(theme) {
      const root = document.getElementById('article-root');
      if (!root) return;
      const candidates = Array.from(root.querySelectorAll('img'));
      const signature = candidates.find((img) => /sign_(light|dark)_nobg\.png$/i.test(img.getAttribute('src') || ''));
      if (!signature) return;
      signature.src = theme === 'dark' ? 'sign_dark_nobg.png' : 'sign_light_nobg.png';
    }

    function addEssayCredits(root, source) {
      const titleHeading = root.querySelector('h1');
      if (!titleHeading) return;
      if (root.querySelector('.essay-meta')) return;

      const isSpanish = (source || '').toLowerCase().endsWith('_es.md');
      const englishLabel = isSpanish
        ? '<a href="./tempi_madres.html?src=tempi_madres.md">English</a>'
        : 'English';
      const spanishLabel = isSpanish
        ? 'Spanish'
        : '<a href="./tempi_madres.html?src=tempi_madres_es.md">Spanish</a>';

      const credits = document.createElement('p');
      credits.className = 'essay-meta';
      credits.innerHTML = `<strong>By:</strong> Konstantinos Kontras &nbsp;•&nbsp; <strong>Published in:</strong> Jacobin &nbsp;•&nbsp; <strong>Languages:</strong> ${englishLabel}, ${spanishLabel}, <a href="https://jacobin.gr/apo-ta-tebi-eos-tis-madres-buscadoras-sto-mexiko/" target="_blank" rel="noopener">Greek</a>`;
      titleHeading.insertAdjacentElement('afterend', credits);
    }

    (async function () {
      const root = document.getElementById('article-root');
      const params = new URLSearchParams(window.location.search);
      const source = params.get('src') || 'tempi_madres.md';
      const extension = source.split('.').pop().toLowerCase();

      try {
        const response = await fetch(source);
        if (!response.ok) throw new Error(`Failed to load ${source} (${response.status})`);
        let raw = await response.text();

        if (extension === 'md' || extension === 'markdown') {
          root.innerHTML = window.marked.parse(raw);
          addEssayCredits(root, source);
          updateSignatureImage(document.body.classList.contains('dark') ? 'dark' : 'light');

          const titleHeading = root.querySelector('h1');
          if (titleHeading && titleHeading.textContent.trim()) {
            document.title = titleHeading.textContent.trim();
          }
          return;
        }

        if (extension === 'tex') {
          document.title = source;
          root.innerHTML = `<h1>${source}</h1><p>TeX source preview:</p><pre>${raw
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')}</pre><p>Tip: for full TeX article conversion, add a build step (for example Pandoc) before deployment.</p>`;
          return;
        }

        root.innerHTML = `<div class="error">Unsupported file type: <code>${extension}</code>. Please use <code>.md</code> or <code>.tex</code>.</div>`;
      } catch (error) {
        root.innerHTML = `<div class="error">Could not load article source <code>${source}</code>.<br/>${error.message}</div>`;
      }
    })();
  </script>
